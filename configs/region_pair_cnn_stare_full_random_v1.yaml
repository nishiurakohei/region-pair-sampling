experiment:
  name: region_pair_cnn_stare_full_random_v1
  seed: 42

data:
  pair_generation_config: configs/region_pair_sampling_stare_full_random_v1.yaml
  pair_metrics_csv: outputs/region_pair_sampling_stare_full_random_v1/metrics/pair_records.csv
  regenerate_pairs: false

split:
  train_fraction: 0.7
  val_fraction: 0.15

model:
  input_size: 64
  marker_radius: 2
  batch_size: 256
  epochs: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  use_cuda: false

paths:
  output_dir: outputs/region_pair_cnn_stare_full_random_v1
