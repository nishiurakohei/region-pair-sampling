experiment:
  name: connectivity_curved_v1
  seed: 42

dataset:
  image_size: 128
  n_train: 5000
  n_val: 1000
  n_test: 1000
  positive_ratio: 0.5
  input_channels: [shape, point_A, point_B]
  shape_families:
    straight: 0.34
    bezier_bend: 0.33
    c_shape: 0.33
  radius_range: [2, 8]
  tube_width_range: [3, 8]
  bottleneck_width_range: [1.5, 4.0]
  target_distance_range: [40, 100]
  bend_strength_range: [8, 50]
  arc_angle_range: [120, 300]
  arc_radius_range: [25, 60]
  noise_circles_range: [0, 24]
  distractor_curves_range: [0, 2]
  negative_modes:
    near_gap: 0.5
    break_bottleneck: 0.5

render:
  grayscale: false
  render_thickness_px: 1

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_dir: data/samples
  model_dir: outputs/models
  metric_dir: outputs/metrics
  figure_dir: outputs/figures
