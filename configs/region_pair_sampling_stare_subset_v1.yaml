experiment:
  name: region_pair_sampling_stare_subset_v1
  seed: 42

dataset:
  mask_glob: data/masks_region_pair_subset_v1/*.png
  sample_limit: 4
  mask_channel: 0
  foreground_threshold: 128
  invert_mask: false
  min_component_area: 32

sampling:
  valid_thresholds: [1, 2, 3]
  methods: [random, euclidean_fps, geodesic_fps, feature_diversity]
  points_per_method: 12
  candidate_pool_limit: 3000
  pair_component_mode: same_component

paths:
  output_dir: outputs/region_pair_sampling_stare_subset_v1
