experiment:
  name: region_pair_cnn_stare_instruction_subset_v2
  seed: 42

data:
  pair_generation_config: configs/region_pair_sampling_stare_instruction_subset_v2.yaml
  pair_metrics_csv: outputs/region_pair_sampling_stare_instruction_subset_v2/metrics/pair_records.csv
  regenerate_pairs: false

split:
  train_fraction: 0.6
  val_fraction: 0.2

model:
  input_size: 64
  marker_radius: 2
  batch_size: 256
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  input_mode: mask_point_i_point_j
  use_cuda: false
  use_mps: true

paths:
  output_dir: outputs/region_pair_cnn_stare_instruction_subset_v2
