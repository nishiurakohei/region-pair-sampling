experiment:
  name: region_pair_sampling_meiyan
  seed: 42

dataset:
  mask_glob: /path/to/Meiyan/masks/**/*.png
  sample_limit: 10
  mask_channel: 0
  foreground_threshold: 128
  invert_mask: false
  min_component_area: 64

sampling:
  valid_thresholds: [2, 4, 6]
  methods: [random, euclidean_fps, geodesic_fps, feature_diversity]
  sample_foreground: true
  sample_background: true
  foreground_points_per_method: 8
  background_points_per_method: 8
  candidate_pool_limit: 6000
  pair_component_mode: all_pairs

paths:
  output_dir: outputs/region_pair_sampling_meiyan
